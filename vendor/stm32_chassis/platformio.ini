[env:genericSTM32F103RC]
platform = ststm32
board = genericSTM32F103RC
framework = cmsis

board_build.hex = true

build_flags =
    -DSTM32F10X_HD
    -std=gnu99
    -O1
    -Wall
    -Wno-unused-variable
    -Wno-unused-function
    -Wno-pointer-sign
    -lm

build_unflags =
    -std=gnu11

; 烧录方式: serial (需要CH340 DTR/RTS自动复位电路)
; 手动烧录: 用FlyMcu等工具, BOOT0接3.3V后复位
upload_protocol = serial
; upload_port = COM3    ; 根据实际串口号修改
upload_speed = 115200
upload_flags =
    -e             ; 下载前全片擦除
    -v             ; 校验
    -g 0x08000000  ; 下载完成后自动跳转到用户程序

[platformio]
src_dir = src
include_dir = include
